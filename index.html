<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NetForge: build and simulate computer networks in your browser."
    />
    <meta name="theme-color" content="#fafaf7" />
    <title>NetForge</title>
    <script>
      // Set the theme before first paint so a saved dark choice never flashes light.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('netforge.theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
